name: Windows build

on:
  push:
  pull_request:

jobs:
  build-and-smoke-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean Domain-Finder.spec
      - name: Verify build artifact
        run: if (-not (Test-Path dist\Domain-Finder.exe)) { throw "EXE was not created" }
      - name: Smoke-test application startup
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\Domain-Finder.exe -PassThru
          Start-Sleep -Seconds 10
          if ($process.HasExited) {
            throw "Domain-Finder exited during startup with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force
